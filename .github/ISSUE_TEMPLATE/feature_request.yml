name: Feature Request
description: Suggest an idea for this project
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a new feature! Please fill out the form below to help us understand your request.

  - type: dropdown
    id: tool
    attributes:
      label: Related Tool
      description: Which editing tool is this feature request for?
      options:
        - Roster Editor
        - Draft Class Editor
        - Coach Editor
        - PID Editor
        - Stats Editor
        - History Editor
        - Expansion Draft Tool
        - Draft Helper
        - Field Editor
        - Salary Cap Editor
        - Commentary Fix Tool
        - Weather Controls
        - Uniform Editor
        - Splash Screen Editor
        - Scorebug Editor
        - Equipment Editor
        - Era Mod Switcher
        - General Application
        - New Tool (specify in description)
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
      placeholder: I'm always frustrated when...

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
      placeholder: I would like to see...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions
      description: Describe any alternative solutions or features you've considered.
      placeholder: Alternatively, we could...

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - Low - Nice to have
        - Medium - Would improve my workflow
        - High - Essential for my use case
        - Critical - Blocking my work
    validations:
      required: true

  - type: dropdown
    id: complexity
    attributes:
      label: Estimated Complexity
      description: How complex do you think this feature would be to implement?
      options:
        - Simple - Small UI change or setting
        - Medium - New functionality within existing tool
        - Complex - Significant new feature or tool
        - Major - Requires architectural changes

  - type: textarea
    id: use_case
    attributes:
      label: Use Case
      description: Describe your specific use case for this feature
      placeholder: |
        I would use this feature when...
        This would help me...
    validations:
      required: true

  - type: textarea
    id: mockups
    attributes:
      label: Mockups/Examples
      description: If applicable, add screenshots, mockups, or examples of similar features

  - type: textarea
    id: technical_details
    attributes:
      label: Technical Details
      description: Any technical considerations or implementation suggestions

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Would you be interested in contributing to this feature?
      options:
        - label: I would be willing to help implement this feature
        - label: I would be available for testing and feedback
        - label: I can provide domain expertise/research

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched for existing feature requests that might be similar
          required: true
        - label: This feature aligns with the project's goals
          required: true
        - label: I have provided sufficient detail for the development team to understand the request
          required: true