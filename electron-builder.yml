appId: com.krazynuttZ.madden-editor-suite
productName: Madden Editor Suite
copyright: Copyright © 2025 KRaZyNuttZ
electronVersion: 38.1.2

extraMetadata:
  main: ".vite/build/main.js"

directories:
  output: dist
  buildResources: build-assets

asar: false

files:
  - ".vite/build/**/*"
  - "package.json"
  - "node_modules/**/*"
  - "!node_modules/**/test"
  - "!node_modules/**/tests"
  - "!node_modules/**/*.md"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build-assets/madden.ico
  artifactName: ${productName}-Setup-${version}.${ext}
  forceCodeSigning: false  # Disable code signing
  compression: normal  # Use normal compression instead of maximum for faster install

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  allowElevation: true
  differentialPackage: false
  packElevateHelper: true
  installerIcon: build-assets/madden.ico
  uninstallerIcon: build-assets/madden.ico
  installerHeader: build-assets/banner.png
  installerSidebar: build-assets/splash.png
  uninstallerSidebar: build-assets/splash.png
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Madden Editor Suite
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  menuCategory: true
  displayLanguageSelector: false
  installerLanguages:
    - en_US
  warningsAsErrors: false

  # Reduce antivirus false positives
  unicode: true
  guid: 5a8f7c3b-1d9e-4a2f-b5c6-8e3d4f2a1b0c

publish: null
